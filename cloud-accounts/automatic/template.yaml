AWSTemplateFormatVersion: 2010-09-09
Description: Creates IAM roles allowing Coralogix to collect metrics, including over AWS PrivateLink, and manage CloudWatch and S3 log ingestion in your AWS account.

Metadata:
  SemanticVersion: 5.0.0
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Coralogix configuration
        Parameters:
          - CoralogixRegion
          - CoralogixCompanyId
          - CustomAWSAccountId
          - CustomRoleSuffix
      - Label:
          default: Role configuration
        Parameters:
          - RoleName
          - ExternalIdSecret

Parameters:
  CoralogixRegion:
    Type: String
    Default: EU1
    Description: The Coralogix region for your account. Select CustomEndpoint to supply a custom trusted AWS account ID and role suffix.
    AllowedValues:
      - staging
      - EU1
      - EU2
      - AP1
      - AP2
      - AP3
      - US1
      - US2
      - US3
      - gov1
      - CustomEndpoint
  CoralogixCompanyId:
    Type: String
    Description: Your Coralogix company ID. Used to build the external ID when ExternalIdSecret is provided.
    AllowedPattern: "[0-9]+"
    MaxLength: 64
  RoleName:
    Type: String
    Default: coralogix-cloud-account
    Description: The name of the main IAM role that will be created. Static service roles use this name with -fh, -ms, -logs, -lm, -shipper, and -plsh suffixes.
    AllowedPattern: '[\w+=,.@-]+'
    MaxLength: 56
  ExternalIdSecret:
    Type: String
    Default: ""
    Description: Optional ExternalIdSecret to increase security for sts:AssumeRole.
    AllowedPattern: '^$|^[\w+=,.:\/-]+$'
    MaxLength: 64
  CustomAWSAccountId:
    Type: String
    Default: ""
    Description: Custom Coralogix AWS account ID. Required when CoralogixRegion is CustomEndpoint.
    AllowedPattern: "^$|^[0-9]{12}$"
  CustomRoleSuffix:
    Type: String
    Default: ""
    Description: Custom suffix for the trusted coralogix-ingestion role. Required when CoralogixRegion is CustomEndpoint.
    AllowedPattern: '[\w+=,.@-]*'
    MaxLength: 44

Mappings:
  CoralogixEnvironment:
    staging:
      AwsAccountId: "233221153619"
      RoleSuffix: stg1
    EU1:
      AwsAccountId: "625240141681"
      RoleSuffix: eu1
    EU2:
      AwsAccountId: "625240141681"
      RoleSuffix: eu2
    AP1:
      AwsAccountId: "625240141681"
      RoleSuffix: ap1
    AP2:
      AwsAccountId: "625240141681"
      RoleSuffix: ap2
    AP3:
      AwsAccountId: "025066248247"
      RoleSuffix: ap3
    US1:
      AwsAccountId: "625240141681"
      RoleSuffix: us1
    US2:
      AwsAccountId: "739076534691"
      RoleSuffix: us2
    US3:
      AwsAccountId: "826308361216"
      RoleSuffix: us3
    gov1:
      AwsAccountId: "309801239943"
      RoleSuffix: gov1
    CustomEndpoint:
      AwsAccountId: "000000000000"
      RoleSuffix: custom

Rules:
  CustomEndpointRequiresAccountIdAndRoleSuffix:
    RuleCondition: !Equals [!Ref CoralogixRegion, CustomEndpoint]
    Assertions:
      - Assert: !Not [!Equals [!Ref CustomAWSAccountId, ""]]
        AssertDescription: CustomAWSAccountId is required when CoralogixRegion is CustomEndpoint.
      - Assert: !Not [!Equals [!Ref CustomRoleSuffix, ""]]
        AssertDescription: CustomRoleSuffix is required when CoralogixRegion is CustomEndpoint.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalIdSecret, ""]]
  IsCustomEndpoint: !Equals [!Ref CoralogixRegion, CustomEndpoint]

Resources:
  CoralogixFirehoseServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-fh"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CoralogixS3BackupAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cx-*
                  - !Sub arn:${AWS::Partition}:s3:::cx-*/*
        - PolicyName: CoralogixPrivateLinkShipperInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConfiguration
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-????????-????-????-????-????????????-sh
                  - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-????????-????-????-????-????????????-sh:*

  CoralogixMetricStreamsServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-ms"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: streams.metrics.cloudwatch.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CoralogixFirehosePutAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !Sub arn:${AWS::Partition}:firehose:*:${AWS::AccountId}:deliverystream/cx-*

  CoralogixCloudWatchLogsServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-logs"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:*
      Policies:
        - PolicyName: CoralogixFirehosePutAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !Sub arn:${AWS::Partition}:firehose:*:${AWS::AccountId}:deliverystream/cx-*

  CoralogixLambdaManagerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-lm"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CoralogixLambdaManagerExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateCoralogixLambdaLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/cx-lc-*-lm
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
              - Sid: WriteCoralogixLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/cx-lc-*-lm:log-stream:*
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
              - Sid: DescribeCustomerLogGroups
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: "*"
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
              - Sid: ManageCustomerLogGroupSubscriptions
                Effect: Allow
                Action:
                  - logs:DescribeSubscriptionFilters
                  - logs:DeleteSubscriptionFilter
                  - logs:PutSubscriptionFilter
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
              - Sid: TagCustomerLogGroups
                Effect: Allow
                Action:
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
                  "ForAllValues:StringLike":
                    aws:TagKeys:
                      - "coralogix:lambda-manager:*"
              - Sid: GetManagedLogGroupsByTag
                Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
              - Sid: PassCoralogixCloudWatchLogsServiceRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CoralogixCloudWatchLogsServiceRole.Arn
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
                  StringEquals:
                    iam:PassedToService: logs.amazonaws.com

  CoralogixShipperExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-shipper"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CoralogixShipperExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSameAccountObjects
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub arn:${AWS::Partition}:s3:::*/*
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref AWS::AccountId
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-*-shipper
              - Sid: DecryptSameAccountS3Objects
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:CallerAccount: !Ref AWS::AccountId
                  StringLike:
                    kms:ViaService: !Sub s3.*.${AWS::URLSuffix}
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-*-shipper
              - Sid: CreateShipperLogGroups
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/cx-*-shipper
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-*-shipper
              - Sid: WriteShipperLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/cx-*-shipper:log-stream:*
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-*-shipper
              - Sid: ManageShipperNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
              - Sid: CreateShipperNetworkInterfaces
                Effect: Allow
                Action: ec2:CreateNetworkInterface
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*
              - Sid: CreateShipperNetworkInterfacesInOwnedNetworks
                Effect: Allow
                Action: ec2:CreateNetworkInterface
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  "Null":
                    aws:ResourceTag/coralogix:cloud-account-owner: "false"
              - Sid: DenyShipperCodeNetworkInterfaces
                Effect: Deny
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DetachNetworkInterface
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
                Condition:
                  "Null":
                    lambda:SourceFunctionArn: "false"

  CoralogixPrivateLinkShipperExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-plsh"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CoralogixPrivateLinkShipperExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateShipperLogGroups
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/cx-????????-????-????-????-????????????-sh
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-????????-????-????-????-????????????-sh
              - Sid: WriteShipperLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/cx-????????-????-????-????-????????????-sh:log-stream:*
                Condition:
                  ArnLike:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-????????-????-????-????-????????????-sh
              - Sid: ManageShipperNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
              - Sid: CreateShipperNetworkInterfaces
                Effect: Allow
                Action: ec2:CreateNetworkInterface
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*
              - Sid: CreateShipperNetworkInterfacesInOwnedNetworks
                Effect: Allow
                Action: ec2:CreateNetworkInterface
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  "Null":
                    aws:ResourceTag/coralogix:cloud-account-owner: "false"
              - Sid: DenyShipperCodeNetworkInterfaces
                Effect: Deny
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DetachNetworkInterface
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
                Condition:
                  "Null":
                    lambda:SourceFunctionArn: "false"

  CoralogixAwsMetricsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Tags:
        - Key: CoralogixCloudAccountTemplateVersion
          Value: "5"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${AWS::Partition}:iam::${AwsAccountId}:role/coralogix-ingestion-${RoleSuffix}"
                - AwsAccountId: !If
                    - IsCustomEndpoint
                    - !Ref CustomAWSAccountId
                    - !FindInMap [
                        CoralogixEnvironment,
                        !Ref CoralogixRegion,
                        AwsAccountId,
                      ]
                  RoleSuffix: !If
                    - IsCustomEndpoint
                    - !Ref CustomRoleSuffix
                    - !FindInMap [
                        CoralogixEnvironment,
                        !Ref CoralogixRegion,
                        RoleSuffix,
                      ]
            Action:
              - sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Sub "${ExternalIdSecret}@${CoralogixCompanyId}"
              - !Ref "AWS::NoValue"
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSResourceExplorerFullAccess
      Policies:
        - PolicyName: CoralogixCloudAccountResourceManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageCoralogixFirehoseDeliveryStreams
                Effect: Allow
                Action:
                  - firehose:CreateDeliveryStream
                  - firehose:DeleteDeliveryStream
                  - firehose:UpdateDestination
                Resource: !Sub arn:${AWS::Partition}:firehose:*:${AWS::AccountId}:deliverystream/cx-*
              - Sid: ManageCoralogixMetricStreams
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricStream
                  - cloudwatch:DeleteMetricStream
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:metric-stream/cx-*
              - Sid: ManageCoralogixBackupBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:DeleteBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::cx-*
              - Sid: DeleteCoralogixBackupObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::cx-*/*
              - Sid: ManageCoralogixLambdaManagers
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:InvokeFunction
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
              - Sid: AddCoralogixLambdaManagerEventBridgePermission
                Effect: Allow
                Action:
                  - lambda:AddPermission
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-lc-*-lm
                Condition:
                  StringEquals:
                    lambda:Principal: events.amazonaws.com
              - Sid: ManageCoralogixEventBridgeRules
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/cx-lc-*-ebr
              - Sid: PassCoralogixFirehoseServiceRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CoralogixFirehoseServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: firehose.amazonaws.com
              - Sid: PassCoralogixMetricStreamsServiceRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CoralogixMetricStreamsServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: streams.metrics.cloudwatch.amazonaws.com
              - Sid: PassCoralogixLambdaManagerExecutionRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CoralogixLambdaManagerExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ManageSourceNotifications
                Effect: Allow
                Action: s3:PutBucketNotification
                Resource: !Sub arn:${AWS::Partition}:s3:::*
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref AWS::AccountId
              - Sid: ManageShippers
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-*-shipper
              - Sid: AddShipperInvokePermission
                Effect: Allow
                Action: lambda:AddPermission
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-*-shipper
                Condition:
                  StringEquals:
                    lambda:Principal:
                      - s3.amazonaws.com
                      - sns.amazonaws.com
                      - !Sub logs.${AWS::URLSuffix}
              - Sid: PassShipperRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CoralogixShipperExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ManageOwnedSnsTopics
                Effect: Allow
                Action: [sns:CreateTopic, sns:DeleteTopic, sns:SetTopicAttributes]
                Resource: !Sub arn:${AWS::Partition}:sns:*:${AWS::AccountId}:cx-s3-*-sns
              - Sid: SubscribeShippers
                Effect: Allow
                Action: sns:Subscribe
                Resource: !Sub arn:${AWS::Partition}:sns:*:${AWS::AccountId}:*
                Condition:
                  StringEquals:
                    sns:Protocol: lambda
                  StringLike:
                    sns:Endpoint: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-*-shipper
              - Sid: UnsubscribeShippers
                Effect: Allow
                Action: sns:Unsubscribe
                Resource: !Sub arn:${AWS::Partition}:sns:*:${AWS::AccountId}:*
              - Sid: CreateOwnedVpcs
                Effect: Allow
                Action: ec2:CreateVpc
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*
                Condition:
                  "Null":
                    aws:RequestTag/coralogix:cloud-account-owner: "false"
              - Sid: CreateOwnedSubnets
                Effect: Allow
                Action: ec2:CreateSubnet
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*
                Condition:
                  "Null":
                    aws:RequestTag/coralogix:cloud-account-owner: "false"
              - Sid: CreateOwnedSecurityGroups
                Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  "Null":
                    aws:RequestTag/coralogix:cloud-account-owner: "false"
              - Sid: CreateOwnedVpcEndpoints
                Effect: Allow
                Action: ec2:CreateVpcEndpoint
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-endpoint/*
                Condition:
                  "Null":
                    aws:RequestTag/coralogix:cloud-account-owner: "false"
                  StringEquals:
                    ec2:VpceServiceOwner:
                      - amazon
                      - !If
                        - IsCustomEndpoint
                        - !Ref CustomAWSAccountId
                        - !FindInMap [CoralogixEnvironment, !Ref CoralogixRegion, AwsAccountId]
              - Sid: CreateOwnedRouteTables
                Effect: Allow
                Action: ec2:CreateRouteTable
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:route-table/*
                Condition:
                  "Null":
                    aws:RequestTag/coralogix:cloud-account-owner: "false"
              - Sid: EnableVpcEndpointPrivateDns
                Effect: Allow
                Action: route53:AssociateVPCWithHostedZone
                Resource: "*"
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: ec2.amazonaws.com
              - Sid: CreateInOwnedNetworks
                Effect: Allow
                Action:
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateVpcEndpoint
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:route-table/*
                Condition:
                  "Null":
                    aws:ResourceTag/coralogix:cloud-account-owner: "false"
              - Sid: TagOwnedNetworkResourcesOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-endpoint/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:route-table/*
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - CreateRouteTable
                      - CreateSecurityGroup
                      - CreateSubnet
                      - CreateVpc
                      - CreateVpcEndpoint
              - Sid: ManageOwnedNetworkResources
                Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteVpc
                  - ec2:DeleteVpcEndpoints
                  - ec2:DisassociateRouteTable
                  - ec2:ModifyVpcAttribute
                  - ec2:ModifyVpcEndpoint
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-endpoint/*
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:route-table/*
                Condition:
                  "Null":
                    aws:ResourceTag/coralogix:cloud-account-owner: "false"
              - Sid: AuthorizeOwnedSecurityGroupRules
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group-rule/*
              - Sid: CreateCrossRegionVpcEndpoints
                Effect: Allow
                Action: vpce:AllowMultiRegion
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-endpoint/*
                  - !Sub arn:${AWS::Partition}:ec2:*:*:vpc-endpoint-service/*
              - Sid: DescribeNetworkResources
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribePrefixLists
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcEndpointServices
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: ManagePrivateLinkShippers
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:cx-????????-????-????-????-????????????-sh
              - Sid: PassPrivateLinkShipperRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CoralogixPrivateLinkShipperExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  CoralogixAwsMetricsRoleArn:
    Description: The ARN of the Coralogix AWS Metrics role.
    Value: !GetAtt CoralogixAwsMetricsRole.Arn
  ExternalId:
    Condition: HasExternalId
    Description: The ExternalId of the Coralogix AWS Metrics role.
    Value: !Sub "${ExternalIdSecret}@${CoralogixCompanyId}"
