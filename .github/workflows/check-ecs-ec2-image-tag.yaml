name: Check ecs-ec2 supervised image tag

# The ecs-ec2 template syncs to integration-definitions and auto-merges there, so this pull
# request is the last gate before customers get it.

on:
  pull_request:
    paths:
      - 'opentelemetry/ecs-ec2/template.yaml'
      # TEMPORARY-TEST-TRIGGER: so this check also runs on the pull request that introduces it,
      # which touches no template. REMOVE BEFORE MERGING.
      - '.github/workflows/check-ecs-ec2-image-tag.yaml'
  workflow_dispatch:

env:
  TEMPLATE: opentelemetry/ecs-ec2/template.yaml

jobs:
  image_tag_released:
    runs-on: ubuntu-latest
    name: Supervised image tag is released
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # SupervisedImageVersion pins an image tag built and released from telemetry-shippers.
      # Naming a tag that is not published yet makes every stack fail on image pull, and
      # nothing downstream would catch it, so compare against the released version.
      - name: Compare against telemetry-shippers
        run: |
          set -euo pipefail

          template_tag=$(yq -r '.Parameters.SupervisedImageVersion.Default' "${TEMPLATE}")
          if [ -z "$template_tag" ] || [ "$template_tag" = "null" ]; then
            echo "::notice::SupervisedImageVersion has no default, nothing to check"
            exit 0
          fi

          released=$(gh api \
            "repos/coralogix/telemetry-shippers/contents/otel-supervised-cdot/CURRENT_IMAGE_VERSION" \
            -H "Accept: application/vnd.github.raw" | tr -d '[:space:]')

          echo "template=${template_tag} released=${released}"

          # Passing means the template is at or behind the released tag. Ahead means the image
          # does not exist yet.
          newest=$(printf '%s\n%s\n' "${template_tag#v}" "${released#v}" | sort -V | tail -1)
          if [ "$template_tag" != "$released" ] && [ "$newest" = "${template_tag#v}" ]; then
            echo "::error::SupervisedImageVersion ${template_tag} is ahead of the released ${released}."
            echo "Release the supervised image in telemetry-shippers first, or lower the default."
            exit 1
          fi
          echo "Image tag is released."
        env:
          # Cross-repository read, so the repo-scoped default token is not enough.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
